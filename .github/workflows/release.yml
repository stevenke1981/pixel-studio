name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libfontconfig1-dev libxdo-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch OCR models
        shell: bash
        run: ./scripts/fetch-models.sh
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          N=pixel-studio-${{ matrix.name }}
          mkdir -p dist/$N/models
          cp README.md README.en.md LICENSE dist/$N/
          cp models/*.onnx dist/$N/models/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/pixel-studio.exe target/release/studio-cli.exe dist/$N/
            cd dist && 7z a $N.zip $N >/dev/null
          else
            cp target/release/pixel-studio target/release/studio-cli dist/$N/
            cd dist && tar czf $N.tar.gz $N
          fi
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-studio-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true

  macos:
    name: Build macOS universal .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binaries and app bundle
        run: ./scripts/macos-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-studio-macos-universal
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
