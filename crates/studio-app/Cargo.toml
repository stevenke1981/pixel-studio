[package]
name = "studio-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pixel-studio"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
image.workspace = true
studio-core = { path = "../studio-core" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3.2"
dirs = "7.0.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
# Windows: the software renderer's partial (damage-region) presentation leaves parts of
# the window unpainted/transparent on some systems, so Skia is used there.
slint = { version = "1.18.1", default-features = false, features = ["renderer-skia"] }
winreg = "0.56"
xcap = { version = "0.9.6", default-features = false }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
