[package]
name = "studio-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
