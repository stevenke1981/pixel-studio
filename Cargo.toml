[workspace]
members = [
    "crates/studio-core",
    "crates/studio-cli",
    "crates/studio-app",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.100"
arboard = "3.6.1"
base64 = "0.22.1"
c2pa = { version = "0.85.0", default-features = false, features = ["file_io", "rust_native_crypto"] }
chrono = "0.4.42"
clap = { version = "4.6.1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp", "ico"] }
imageproc = { version = "0.26.2", default-features = false, features = ["rayon", "text"] }
rayon = "1.11.0"
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
walkdir = "2.5.0"

# Size-focused release profile (see README "Binary size").
# Everything is size-optimised ("s") except the pixel/OCR hot paths, which stay at 3.
# panic stays "unwind": a panicking worker thread (OCR, batch) must not kill the GUI.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.studio-core]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.imageproc]
opt-level = 3

[profile.release.package.rten]
opt-level = 3

[profile.release.package.rten-tensor]
opt-level = 3

[profile.release.package.rten-gemm]
opt-level = 3

[profile.release.package.rten-vecmath]
opt-level = 3

[profile.release.package.rten-simd]
opt-level = 3

[profile.release.package.ocrs]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.tiff]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.rayon-core]
opt-level = 3

# Optimised but quick-to-link profile for CI test runs.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = false
